[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-astrodynamics-simulation"
version = "0.3.1"
description = "Validated lunar orbit simulation with J2 and GRAIL spherical-harmonic gravity models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
spice = ["spiceypy>=6,<8"]
terrain = ["netCDF4>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
