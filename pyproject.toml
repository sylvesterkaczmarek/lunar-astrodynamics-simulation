[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-astrodynamics-simulation"
version = "0.4.0"
description = "Scientific lunar orbit propagation and preliminary mission-analysis tooling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
spice = ["spiceypy>=6,<8"]
terrain = ["netCDF4>=1.6,<2"]
validation = [
  "spiceypy>=6,<8",
  "pyshtools>=4.11,<5",
  "mpmath>=1.3,<2",
]

[project.scripts]
lunar-mission = "lunar_astrodynamics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
