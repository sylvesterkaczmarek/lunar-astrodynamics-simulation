name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest
      - name: J2 smoke example
        if: matrix.python-version == '3.12'
        run: python examples/j2_precession.py --orbits 10 --metrics-path /tmp/j2.json --figure-path /tmp/j2.svg
      - name: Harmonic smoke example
        if: matrix.python-version == '3.12'
        run: python examples/harmonic_validation.py --output /tmp/harmonics.json
      - name: Gravity uncertainty smoke example
        if: matrix.python-version == '3.12'
        run: python examples/gravity_uncertainty.py --samples 3 --duration-days 0.05 --output /tmp/gravity_uncertainty.json
      - name: Official LOLA LDEM_4 reference probe
        if: matrix.python-version == '3.12'
        run: python scripts/validate_lola_pds_reference.py
      - name: Degree-1200 gravity benchmark smoke
        if: matrix.python-version == '3.12'
        run: python scripts/benchmark_harmonics.py --degree 1200 --repetitions 2
