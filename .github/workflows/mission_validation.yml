name: Mission workflow validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record mission workflow validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run validation and record output
        shell: bash
        run: |
          set +e
          python -m pytest > /tmp/pytest.txt 2>&1
          pytest_status=$?
          lunar-mission all examples/missions/polar_quick.toml --output-dir /tmp/configured-mission > /tmp/mission.txt 2>&1
          mission_status=$?
          set -e
          {
            echo "pytest_status=$pytest_status"
            cat /tmp/pytest.txt
            echo
            echo "mission_status=$mission_status"
            cat /tmp/mission.txt
          } > results/mission_workflow_validation.txt
          git config user.name "Repository validation"
          git config user.email "validation@users.noreply.github.com"
          git add results/mission_workflow_validation.txt
          git commit -m "Record mission workflow validation"
          git push origin HEAD:main
          if [ "$pytest_status" -ne 0 ] || [ "$mission_status" -ne 0 ]; then
            exit 1
          fi
