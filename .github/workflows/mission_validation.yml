name: Mission workflow validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record public data mission validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .[dev,spice]
      - name: Download and run public data mission
        shell: bash
        run: |
          set +e
          python scripts/download_example_mission_data.py > /tmp/download.log 2>&1
          download_status=$?
          analyse_status=99
          if [ "$download_status" -eq 0 ]; then
            lunar-mission analyse examples/missions/polar_high_fidelity.toml --output-dir /tmp/public-mission > /tmp/analyse.log 2>&1
            analyse_status=$?
          fi
          set -e

          {
            echo "download_status=$download_status"
            cat /tmp/download.log
            echo
            echo "analyse_status=$analyse_status"
            if [ -f /tmp/analyse.log ]; then cat /tmp/analyse.log; fi
            if [ "$analyse_status" -eq 0 ]; then
              echo
              echo "structured_summary"
              python - <<'PY'
import json
from pathlib import Path
payload = json.loads(Path('/tmp/public-mission/mission.json').read_text())
print(json.dumps({
    'summary': payload['summary'],
    'dynamics': payload['provenance']['dynamics'],
    'surface_frame': payload['provenance']['surface_frame'],
    'terrain': payload['provenance']['terrain'],
    'spice': payload['provenance']['spice'],
}, indent=2))
PY
            fi
          } > results/mission_workflow_full_validation.txt

          git config user.name "Repository validation"
          git config user.email "validation@users.noreply.github.com"
          git add results/mission_workflow_full_validation.txt
          git commit -m "Record public data mission validation"
          git push origin HEAD:main

          if [ "$download_status" -ne 0 ] || [ "$analyse_status" -ne 0 ]; then
            exit 1
          fi
