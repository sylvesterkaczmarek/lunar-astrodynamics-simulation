name: Mission workflow validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record diagnostic mission workflow validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .[dev,spice]
      - name: Run and record each public data workflow
        shell: bash
        run: |
          set +e
          python scripts/download_example_mission_data.py > /tmp/download.log 2>&1
          download_status=$?

          analyse_status=99
          access_status=99
          search_status=99
          uncertainty_status=99
          fidelity_status=99

          if [ "$download_status" -eq 0 ]; then
            lunar-mission analyse examples/missions/polar_high_fidelity.toml --output-dir /tmp/full-mission > /tmp/analyse.log 2>&1
            analyse_status=$?
            lunar-mission access examples/missions/polar_high_fidelity.toml --output-dir /tmp/full-access > /tmp/access.log 2>&1
            access_status=$?
            lunar-mission search examples/missions/polar_high_fidelity.toml --output-dir /tmp/full-search > /tmp/search.log 2>&1
            search_status=$?
            lunar-mission uncertainty examples/missions/polar_high_fidelity.toml --output-dir /tmp/full-uncertainty > /tmp/uncertainty.log 2>&1
            uncertainty_status=$?
            lunar-mission fidelity examples/missions/polar_high_fidelity.toml --output-dir /tmp/full-fidelity > /tmp/fidelity.log 2>&1
            fidelity_status=$?
          fi
          set -e

          {
            echo "download_status=$download_status"
            cat /tmp/download.log
            for name in analyse access search uncertainty fidelity; do
              eval status=\${${name}_status}
              echo
              echo "${name}_status=$status"
              if [ -f "/tmp/${name}.log" ]; then cat "/tmp/${name}.log"; fi
            done
          } > results/mission_workflow_full_validation.txt

          git config user.name "Repository validation"
          git config user.email "validation@users.noreply.github.com"
          git add results/mission_workflow_full_validation.txt
          git commit -m "Record diagnostic mission workflow validation"
          git push origin HEAD:main

          if [ "$download_status" -ne 0 ] || [ "$analyse_status" -ne 0 ] || [ "$access_status" -ne 0 ] || [ "$search_status" -ne 0 ] || [ "$uncertainty_status" -ne 0 ] || [ "$fidelity_status" -ne 0 ]; then
            exit 1
          fi
