name: Final Python readiness matrix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  matrix-audit:
    if: github.event.head_commit.message != 'Record scientist readiness Python matrix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test Python 3.10
        run: |
          python -m pip install -e .[dev]
          python -m pytest | tee /tmp/pytest310.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python 3.12
        run: |
          python -m pip install -e .[dev]
          python -m pytest | tee /tmp/pytest312.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test Python 3.13
        run: |
          python -m pip install -e .[dev]
          python -m pytest | tee /tmp/pytest313.txt

      - name: Record matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('results/scientist_readiness_audit.json')
          record = json.loads(path.read_text(encoding='utf-8'))
          matrix = {}
          for label, filename in [('3.10', '/tmp/pytest310.txt'), ('3.12', '/tmp/pytest312.txt'), ('3.13', '/tmp/pytest313.txt')]:
              text = Path(filename).read_text(encoding='utf-8')
              match = re.search(r'(\d+) passed in ([0-9.]+)s', text)
              if not match:
                  raise SystemExit(f'could not parse pytest output for {label}')
              matrix[label] = {'passed': int(match.group(1)), 'failed': 0, 'duration_s': float(match.group(2))}
          record['python_test_matrix'] = matrix
          path.write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "Repository validation"
          git config user.email "validation@users.noreply.github.com"
          git add results/scientist_readiness_audit.json
          git commit -m "Record scientist readiness Python matrix"
          git push origin HEAD:main
