[mission]
name = "Low polar lunar screening mission"
epoch_utc = "2026-08-18T00:00:00"
duration_s = 10800.0
output_cadence_s = 120.0

[state]
kind = "elements"

[state.elements]
semi_major_axis_altitude_m = 100000.0
eccentricity = 0.005
inclination_deg = 90.0
raan_deg = 0.0
argument_of_periapsis_deg = 270.0
