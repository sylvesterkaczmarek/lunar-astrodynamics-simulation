[gravity]
model = "j2"

[perturbations]
earth = false
sun = false

[srp]
enabled = false

[terrain]
kind = "none"

[integration]
method = "DOP853"
rtol = 1e-11
position_atol_m = 1e-4
velocity_atol_m_s = 1e-7
max_step_s = 120.0

[access]
minimum_elevation_deg = 10.0
terrain_aware = false

[[sites]]
name = "Equatorial reference site"
latitude_deg = 0.0
longitude_deg_east = 0.0
elevation_m = 0.0
coordinate_source = "synthetic workflow geometry reference"

[[sites]]
name = "Northern reference site"
latitude_deg = 45.0
longitude_deg_east = 0.0
elevation_m = 0.0
coordinate_source = "synthetic workflow geometry reference"

[coverage]
enabled = true
latitude_min_deg = -60.0
latitude_max_deg = 60.0
latitude_step_deg = 30.0
longitude_min_deg_east = 0.0
longitude_max_deg_east = 360.0
